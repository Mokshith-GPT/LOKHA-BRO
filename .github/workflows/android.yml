name: Android CI

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lokha-bro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable review APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LOKHA-BRO-review.apk
          gh release view keyboard-preview >/dev/null 2>&1 || gh release create keyboard-preview --target "$GITHUB_SHA" --title "LOKHA BRO Keyboard Preview" --notes "Experimental Android keyboard with >commands and configurable OpenAI key. Debug build; not production signed. Uninstall previous preview if signature differs." --prerelease
          gh release upload keyboard-preview LOKHA-BRO-review.apk --clobber
