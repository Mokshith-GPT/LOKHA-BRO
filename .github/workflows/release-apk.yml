name: Signed APK Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LOKHA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing LOKHA_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lokha-release.jks"
      - name: Build signed release APK
        env:
          LOKHA_KEYSTORE_PATH: ${{ runner.temp }}/lokha-release.jks
          LOKHA_KEYSTORE_PASSWORD: ${{ secrets.LOKHA_KEYSTORE_PASSWORD }}
          LOKHA_KEY_ALIAS: ${{ secrets.LOKHA_KEY_ALIAS }}
          LOKHA_KEY_PASSWORD: ${{ secrets.LOKHA_KEY_PASSWORD }}
        run: |
          test -n "$LOKHA_KEYSTORE_PASSWORD" || (echo "Missing LOKHA_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$LOKHA_KEY_ALIAS" || (echo "Missing LOKHA_KEY_ALIAS secret" && exit 1)
          test -n "$LOKHA_KEY_PASSWORD" || (echo "Missing LOKHA_KEY_PASSWORD secret" && exit 1)
          gradle assembleRelease
      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk.sha256 \
            --title "LOKHA BRO $TAG" \
            --notes "Android APK release. Verify the SHA-256 checksum before installing. Review README.md for current feature limitations."
